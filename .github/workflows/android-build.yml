name: Build Android App

# Runs entirely on GitHub's own servers — nothing builds on your Mac.
# Trigger it manually from the "Actions" tab (Run workflow), or it runs
# automatically on every push to main. Produces two downloadable files:
#   1. A debug APK — install this directly on your own Android phone to test
#   2. A signed release AAB — the file you actually upload to Play Console
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build the web app
        run: npm run build

      - name: Set up Java (needed for Android builds)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Regenerated fresh every run rather than committed to the repo — a
      # native Android project is thousands of generated files that don't
      # need to live in git and would just go stale between updates.
      - name: Add Android platform via Capacitor
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      # Capacitor 6 generates projects targeting API level 34 by default,
      # but Google now requires at least API level 35 for new releases —
      # this bumps both compile and target SDK versions in the generated
      # project before building, so every build stays compliant even as
      # Google raises this minimum again in the future.
      - name: Bump target SDK to meet Google Play's current requirement
        run: |
          sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion = 35/' android/variables.gradle
          sed -i 's/targetSdkVersion = [0-9]*/targetSdkVersion = 35/' android/variables.gradle

      - name: Build debug APK (for testing on your own phone)
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: darousha-fresh-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # GitHub Actions doesn't allow checking secrets directly inside an
      # if: condition (it's rejected at parse time, not just at runtime) —
      # so the secret has to be checked inside a normal script step instead,
      # which then records the result as a step "
