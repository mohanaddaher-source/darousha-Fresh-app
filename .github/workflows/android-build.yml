name: Build Android App

# Runs entirely on GitHub's own servers — nothing builds on your Mac.
# Trigger it manually from the "Actions" tab (Run workflow), or it runs
# automatically on every push to main. Produces two downloadable files:
#   1. A debug APK — install this directly on your own Android phone to test
#   2. A signed release AAB — the file you actually upload to Play Console
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build the web app
        run: npm run build

      - name: Set up Java (needed for Android builds)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Regenerated fresh every run rather than committed to the repo — a
      # native Android project is thousands of generated files that don't
      # need to live in git and would just go stale between updates.
      - name: Add Android platform via Capacitor
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Build debug APK (for testing on your own phone)
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: darousha-fresh-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # The release build is only attempted if the signing secrets below
      # have actually been added to this repo (Settings → Secrets and
      # variables → Actions). Until then this step is skipped rather than
      # failing the whole workflow, so the debug APK above still comes
      # through even before signing is set up.
      - name: Decode signing keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/app/darousha-release-key.keystore

      - name: Add release signing config
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          cat >> android/app/build.gradle << 'EOF'

          android {
              signingConfigs {
                  release {
                      storeFile file("darousha-release-key.keystore")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias "darousha-fresh"
                      keyPassword System.getenv("KEYSTORE_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Build signed release AAB (for Play Console)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: cd android && ./gradlew bundleRelease

      - name: Upload release AAB
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        uses: actions/upload-artifact@v4
        with:
          name: darousha-fresh-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
